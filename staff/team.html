<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PICNIC DAY 출석 확인·팀 배정</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  .tm-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
  @media (max-width:820px){.tm-grid{grid-template-columns:1fr}}
  .tm-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .tm-stat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .tm-stat .n{font-size:26px;font-weight:900;color:var(--wine-deep)}.tm-stat .l{font-size:12px;color:var(--ink-soft);font-weight:700}
  .tm-stat.alert .n{color:var(--bad)}
  .tm-search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--cream);outline:0;margin-bottom:10px}
  .tm-filter{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tm-filter button{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;background:var(--cream);font-size:13px;font-weight:700;color:var(--ink-soft)}
  .tm-filter button.on{background:var(--wine-deep);color:#fff}
  .tm-p{display:flex;align-items:center;gap:10px;padding:11px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:10px}
  .tm-p:first-child{border-top:0}.tm-p:hover{background:#fdf7f8}
  .tm-p.sel{background:#fbe9ee}
  .tm-p input{width:20px;height:20px;accent-color:var(--wine-deep);flex:none}
  .tm-p .nm{font-weight:700;font-size:15px}.tm-p .sb{font-size:12px;color:var(--ink-soft)}
  .tm-p .r{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-soft);white-space:nowrap}
  .tm-group{border:1.5px dashed #e3cdd3;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tm-group .gn{font-weight:700}
  .tm-sticky{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--wine-deep);padding:12px 14px;margin:12px -16px -16px;border-radius:0 0 14px 14px}
  .tm-team{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .tm-team .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .tm-team .tn{font-size:16px;font-weight:900;color:var(--wine-deep)}
  .tm-chip{display:inline-flex;align-items:center;gap:4px;margin:3px 4px 0 0;padding:4px 6px 4px 10px;border-radius:999px;background:var(--cream);font-size:13px}
  .tm-chip button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px;font-size:12px;color:var(--ink-soft)}
  .tm-chip button:hover{background:#f1dde2;color:var(--bad)}
  [data-drag]{cursor:grab}[data-drag]:active{cursor:grabbing}
  .tm-dragging{opacity:.45}
  .tm-team.drop-on,.tm-new.drop-on{border-color:var(--wine-deep);background:#fbe9ee;box-shadow:0 0 0 3px rgba(124,31,61,.15)}
  .tm-new{border:2px dashed #d9c6cc;border-radius:14px;padding:16px;margin-bottom:10px;text-align:center;color:var(--ink-soft);font-weight:700;font-size:14px}
  .tm-hint{font-size:12.5px;color:var(--ink-soft);background:#fff8e6;border-radius:10px;padding:8px 10px;margin:-2px 0 10px;line-height:1.5}
  .tm-auto{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.5}
  .tm-auto.on{border-color:#3f7a5c;background:#f3fbf6}
  .tm-auto .sw{all:unset;cursor:pointer;flex:none;width:46px;height:26px;border-radius:99px;background:#d6c8cc;position:relative}
  .tm-auto .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
  .tm-auto.on .sw{background:#3f7a5c}.tm-auto.on .sw::after{left:23px}
  .st-sel{border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#fff;min-width:0;flex:1 1 160px}
</style>
</head>
<body>
<div id="st-app" style="display:none">
  <div class="st-top">
    <div style="flex:1;min-width:0"><div class="b">출석 확인 · 팀 배정</div><div class="w" id="st-who"></div></div>
    <a href="./">스태프 메인</a>
    <button type="button" id="st-logout">로그아웃</button>
  </div>
  <div class="st-main">
    <div class="tm-auto" id="tm-auto"></div>
    <div class="tm-stats" id="tm-stats"></div>
    <div id="tm-pre"></div>
    <div class="tm-grid">
      <div>
        <div class="st-card">
          <h3>출석한 학생</h3>
          <div class="st-muted" style="margin:-4px 0 10px;line-height:1.55">학생 휴대폰의 <b>출석 완료 화면</b>(초록 체크 · 이름 · 출석 시각)을 확인하고, 아래 목록에서 같은 이름을 골라 팀에 배정해 주세요. 여러 명을 한 번에 고를 수 있어요.</div>
          <input class="tm-search" id="tm-q" placeholder="이름·단과대·반으로 찾기">
          <div class="tm-filter" id="tm-filter">
            <button type="button" data-f="check" class="on">확인 대기</button>
            <button type="button" data-f="wait">미배정</button>
            <button type="button" data-f="all">전체</button>
            <button type="button" data-f="done">배정 완료</button>
          </div>
          <div id="tm-list"></div>
          <div class="tm-sticky" id="tm-action"></div>
        </div>
      </div>
      <div>
        <div class="st-card">
          <h3>팀 목록 <span class="st-muted" id="tm-teamcount"></span></h3>
          <div class="tm-hint">🖱️ 왼쪽 학생을 <b>마우스로 끌어다 팀 카드에 놓으면</b> 바로 배정돼요. 체크한 여러 명을 한꺼번에 끌 수도 있고, 팀 카드 안의 이름을 다른 팀으로 끌면 팀이 옮겨져요.</div>
          <div class="tm-new" data-drop="new">＋ 여기로 끌어 놓으면 새 팀 만들기</div>
          <input class="tm-search" id="tm-tq" placeholder="팀 이름·팀원으로 찾기">
          <div id="tm-teams"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="common.js?v=20261027"></script>
<script>
(function(){
  "use strict";
  var P = window.PK, esc = P.esc;
  var users = [], teams = [], sel = {}, filter = "check", q = "", tq = "";
  var cfg = {}, roster = null, autoBusy = {};

  function teamOf(id){ return teams.filter(function(t){ return t.id === id; })[0]; }
  function userOf(id){ return users.filter(function(u){ return u.id === id; })[0]; }
  function label(u){ return [u.d.college, u.d.teamName].filter(Boolean).join(" · "); }
  function match(u, s){ if(!s) return true; return [u.d.name, u.d.college, u.d.teamName, u.d.team].join(" ").toLowerCase().indexOf(s.toLowerCase()) >= 0; }

  /* ---------- 같은 조 자동 배정 ----------
     멘토가 있는 기존 멘토링 조(명단 기준)는 출석하면 그 조 이름의 팀으로 바로 들어가요.
     멘토 없는 조(단과대별 멘티)는 지금처럼 현장에서 배정해요. 이 페이지가 열려 있는 동안 동작해요. */
  function autoOn(){ return cfg.autoAssign !== false; }
  /* 어드바이저(교수님)가 함께 오는 반: 인원이 적어도 그 반끼리 한 팀 (윤기정 과장님 요청) */
  var ADVISORS = {
    "자유전공학부 자유 04반": { name: "박건영", major: "국제통상학", note: "12:00~13:00, 15:00~17:00 참석" },
    "자유전공학부 자유 12반": { name: "경민정", major: "식품영양학", note: "12:00부터 잠깐 참석" },
    "자유전공학부 자유 13반": { name: "이호림", major: "바이오공학", note: "13:20~14:00 참석" },
    "글로벌융합대학 글융 2반": { name: "권은희", major: "스페인어전공", note: "" },
    "글로벌융합대학 글융 8반": { name: "이문영", major: "회계학전공", note: "" },
    "글로벌융합대학 글융 10반": { name: "남현정", major: "국제통상학전공", note: "" },
    "글로벌융합대학 글융 18반": { name: "김도혜", major: "문화인류학전공", note: "" },
    "과학기술대학 과기 7반": { name: "강지헌", major: "디지털소프트웨어공학", note: "" }
  };
  function advisorOf(t){ var k = t && t.d ? (t.d.sourceTeam || t.d.name) : ""; return ADVISORS[k] || null; }
  function mentorTeamKeys(){
    var m = {}; (roster || []).forEach(function(r){ if(r.role === "멘토") m[r.teamKey || ((r.college ? r.college + " " : "") + (r.team || ""))] = 1; });
    return m;
  }
  function autoTeamId(key){ return "auto_" + String(key).replace(/[\/\s.#$\[\]]+/g, "_"); }
  function runAuto(){
    if(!autoOn() || !roster) return;
    /* 자동 배정은 ① 그 반 멘토가 실제로 출석했을 때 ② 어드바이저(교수님) 참여 반일 때만.
       멘토가 아직 안 온 반 학생은 '미배정'으로 기다리다가, 멘토가 출석하면 그때 같이 묶여요. */
    var mentors = {}, mk = {}, groups = {};
    users.forEach(function(u){ if(u.d.attendAt && u.d.role === "멘토" && u.d.team) mentors[u.d.team] = 1; });
    Object.keys(mentors).forEach(function(k){ mk[k] = 1; });
    Object.keys(ADVISORS).forEach(function(k){ mk[k] = 1; });
    users.forEach(function(u){
      if(!u.d.attendAt || u.d.teamId || autoBusy[u.id]) return;
      var k = u.d.team; if(!k || !mk[k]) return;
      (groups[k] = groups[k] || []).push(u.id);
    });
    Object.keys(groups).forEach(function(k){
      var ids = groups[k]; ids.forEach(function(id){ autoBusy[id] = 1; });
      var tid = autoTeamId(k), db = P.db, FV = firebase.firestore.FieldValue;
      var first = userOf(ids[0]);
      var adv = ADVISORS[k];
      var tdoc = { name: k, hasMentor: !!mentors[k], sourceTeam: k, auto: true, createdAt: Date.now(), createdBy: "자동 배정" };
      if(adv) tdoc.advisor = adv.name;
      db.collection("picnic_teams").doc(tid).set(tdoc, { merge: true })
        .then(function(){
          var batch = db.batch();
          ids.forEach(function(id){ batch.update(db.collection("picnic_users").doc(id), { teamId: tid, assignedAt: Date.now(), assignedBy: "자동 배정" }); });
          batch.update(db.collection("picnic_teams").doc(tid), { members: FV.arrayUnion.apply(FV, ids) });
          return batch.commit();
        })
        .then(function(){ P.toast("[" + k + "] 자동 배정 " + ids.length + "명" + (first ? " (" + first.d.name + (ids.length > 1 ? " 외" : "") + ")" : ""), "ok"); })
        .catch(function(e){ ids.forEach(function(id){ delete autoBusy[id]; }); fail(e); });
    });
  }
  function renderAuto(){
    var el = document.getElementById("tm-auto"); if(!el) return;
    var on = autoOn(), dOld = el.querySelector("details"), dOpen = dOld ? dOld.open : false;
    el.className = "tm-auto" + (on ? " on" : "");
    el.innerHTML = '<button class="sw" type="button" data-act="auto-toggle" aria-label="자동 배정 켜고 끄기"></button>' +
      '<div><b>같은 조 자동 배정 ' + (on ? "켜짐" : "꺼짐") + '</b><br><span class="st-muted">' +
      (on ? "<b>그 반 멘토가 출석한 반</b>과 <b>어드바이저(교수님)가 오는 반</b>은 출석하면 그 반 팀에 미리 들어가요. 멘토가 아직 안 온 반 학생은 미배정으로 기다리다가 멘토가 오면 같이 묶여요. 미션은 운영본부에서 학생 화면을 보고 <b>[출석 확인]</b>을 눌러야 열려요. 멘토 없는 조는 확인 후 끌어다 배정해요. (이 페이지를 켜 둔 동안 동작)" : "모든 학생을 아래에서 직접 배정해요. 미션은 [출석 확인]을 눌러야 열려요.") +
      (roster ? "" : " · 명단 불러오는 중") + '</span>' +
      '<details style="margin-top:8px"' + (dOpen ? " open" : "") + '><summary style="cursor:pointer;font-weight:700;color:var(--wine-deep)">👩‍🏫 어드바이저(교수님) 참여 반 ' + Object.keys(ADVISORS).length + '개 — 인원이 적어도 그 반끼리 한 팀</summary>' +
      '<div style="margin-top:6px;display:grid;gap:4px">' + Object.keys(ADVISORS).map(function(k){ var a = ADVISORS[k];
        var t = teams.filter(function(x){ return (x.d.sourceTeam || x.d.name) === k; })[0];
        return '<div style="font-size:13px"><b>' + esc(k.replace(/^\S+\s/, "")) + '</b> · ' + esc(a.name) + ' 교수님 (' + esc(a.major) + ')' + (a.note ? ' · <span style="color:#a0522d">' + esc(a.note) + '</span>' : '') +
          ' · ' + (t ? '<span class="st-tag ok">' + (t.d.members || []).length + '명 출석</span>' : '<span class="st-tag gray">아직 없음</span>') + '</div>'; }).join("") + '</div></details>' +
      '</div>';
  }

  /* ---------- 사전 신청자 (사전 미션 '피크닉데이 참석 확인'에서 [참석]) ---------- */
  var pre = null, preFilter = "absent";
  function renderPre(){
    var el = document.getElementById("tm-pre"); if(!el) return;
    if(!pre){ el.innerHTML = ""; return; }
    var dOld = el.querySelector("details"), dOpen = dOld ? dOld.open : false;
    var byId = {}; users.forEach(function(u){ if(u.d.attendAt) byId[u.id] = u; });
    var came = pre.filter(function(v){ return byId[v.rosterId]; }), absent = pre.filter(function(v){ return !byId[v.rosterId]; });
    var list = preFilter === "absent" ? absent : preFilter === "came" ? came : pre;
    var groups = {};
    list.forEach(function(v){ var k = v.teamKey || v.team || "반 정보 없음"; (groups[k] = groups[k] || []).push(v); });
    var keys = Object.keys(groups).sort(function(a, b){ return a.localeCompare(b, "ko", { numeric: true }); });
    el.innerHTML = '<details class="st-card" style="margin-bottom:12px"' + (dOpen ? " open" : "") + '><summary style="cursor:pointer;font-weight:900;font-size:15px">📋 사전 신청자 ' + pre.length + '명 — 출석 <span style="color:#2f6a4c">' + came.length + '명</span> · 아직 안 옴 <span style="color:var(--bad)">' + absent.length + '명</span> <span class="st-muted" style="font-weight:400;font-size:12.5px">(눌러서 명단 보기)</span></summary>' +
      '<div class="st-muted" style="margin:8px 0">사전 미션 "피크닉데이 참석 확인"에서 <b>[참석]</b>을 고른 학생이에요. 출석체크를 하면 자동으로 "출석"으로 넘어가요.</div>' +
      '<div class="tm-filter" style="margin-bottom:10px">' + [["absent","아직 안 옴 " + absent.length],["came","출석 " + came.length],["all","전체 " + pre.length]].map(function(f){ return '<button type="button" data-pf="' + f[0] + '" class="' + (preFilter === f[0] ? "on" : "") + '">' + f[1] + '</button>'; }).join("") + '</div>' +
      (keys.length ? keys.map(function(k){
        return '<div style="padding:8px 0;border-top:1px solid var(--line)"><div style="font-weight:800;font-size:13.5px;margin-bottom:5px">' + esc(k.replace(/^\S+\s/, "")) + ' <span class="st-muted" style="font-weight:400">· ' + esc(k.split(" ")[0]) + ' · ' + groups[k].length + '명</span></div><div>' +
          groups[k].map(function(v){ var u = byId[v.rosterId];
            return '<span class="tm-chip" style="padding-right:10px;' + (u ? "background:#e6f2ec;color:#2f6a4c" : "") + '">' + esc(v.name || "") + (v.role === "멘토" ? " (멘토)" : "") + (u ? ' <span style="font-size:11px">출석 ' + P.hhmm(u.d.attendAt) + '</span>' : "") + '</span>';
          }).join("") + '</div></div>';
      }).join("") : '<div class="st-muted" style="padding:10px 0">' + (preFilter === "absent" ? "사전 신청자가 모두 왔어요! 🎉" : "해당하는 학생이 없어요.") + '</div>') +
      '</details>';
  }
  function render(){
    renderAuto();
    renderPre();
    var att = users.filter(function(u){ return u.d.attendAt; });
    var wait = att.filter(function(u){ return !u.d.teamId; });
    document.getElementById("tm-stats").innerHTML =
      stat("출석", att.length) + stat("확인 대기", att.filter(function(u){ return !u.d.verifiedAt; }).length, att.some(function(u){ return !u.d.verifiedAt; })) +
      stat("미배정", wait.length, wait.length > 0) + stat("배정 완료", att.length - wait.length);
    renderList(att);
    renderAction();
    renderTeams();
  }
  function stat(l, n, alert){ return '<div class="tm-stat' + (alert ? " alert" : "") + '"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }

  function renderList(att){
    var list = att.filter(function(u){ return (filter === "all" || (filter === "check" ? !u.d.verifiedAt : filter === "wait" ? !u.d.teamId : !!u.d.teamId)) && match(u, q); });
    list.sort(function(a, b){ return (b.d.attendAt || 0) - (a.d.attendAt || 0); });
    var el = document.getElementById("tm-list");
    lastList = list.map(function(u){ return u.id; });
    if(!list.length){ el.innerHTML = '<div class="st-muted" style="padding:14px 4px">' + (!q && filter === "check" ? "확인을 기다리는 학생이 없어요." : !q && filter === "wait" ? "배정을 기다리는 학생이 없어요." : "해당하는 학생이 없어요.") + '</div>'; return; }
    var unv = list.filter(function(u){ return u.d.teamId && !u.d.verifiedAt; }).length;
    el.innerHTML = (list.length > 1 ? '<div class="st-row" style="margin:0 0 6px;gap:6px"><button class="st-btn ghost sm" type="button" data-act="sel-all">보이는 ' + list.length + '명 모두 선택</button>' +
      (unv ? '<span class="st-muted" style="font-size:12.5px">체크한 뒤 아래 <b>[선택한 학생 출석 확인]</b>으로 한 번에 확인할 수 있어요.</span>' : '') + '</div>' : '') + list.map(function(u){
      var t = u.d.teamId ? teamOf(u.d.teamId) : null;
      return '<label class="tm-p' + (sel[u.id] ? " sel" : "") + '" draggable="true" data-drag="' + esc(u.id) + '"><input type="checkbox" data-sel="' + esc(u.id) + '"' + (sel[u.id] ? " checked" : "") + '>' +
        '<div style="min-width:0"><div class="nm">' + esc(u.d.name) + ' ' + (u.d.role === "멘토" ? '<span class="st-tag">멘토</span>' : '<span class="st-tag gray">멘티</span>') + '</div><div class="sb">' + esc(label(u)) + '</div></div>' +
        '<div class="r">출석 ' + P.hhmm(u.d.attendAt) + '<br>' + (t ? '<span class="st-tag ok">' + esc(t.d.name) + '</span>' : '<span class="st-tag bad">미배정</span>') +
          (u.d.verifiedAt ? '<br><span class="st-tag gray" style="margin-top:3px">확인 ' + P.hhmm(u.d.verifiedAt) + '</span>' :
            '<br><button class="st-btn sm" type="button" data-verify="' + esc(u.id) + '" style="margin-top:4px">출석 확인</button>') + '</div></label>';
    }).join("");
  }

  function renderAction(){
    var ids = Object.keys(sel).filter(function(k){ return sel[k]; });
    var el = document.getElementById("tm-action");
    if(!ids.length){ el.style.display = "none"; el.innerHTML = ""; return; }
    var ae = document.activeElement; if(ae && el.contains(ae) && ae.tagName === "INPUT") return; /* 팀 이름 입력 중엔 다시 그리지 않아요 */
    el.style.display = "block";
    var first = userOf(ids[0]);
    var prevM = document.getElementById("tm-mentor");
    var mChecked = prevM ? prevM.checked : ids.some(function(id){ var u = userOf(id); return u && u.d.role === "멘토"; });
    var prevName = document.getElementById("tm-newname");
    var suggest = prevName ? prevName.value : (first ? (first.d.team || first.d.teamName || "") : "");
    var opts = teams.slice().sort(function(a, b){ return String(a.d.name).localeCompare(String(b.d.name), "ko"); })
      .map(function(t){ return '<option value="' + esc(t.id) + '">' + esc(t.d.name) + ' (' + (t.d.members || []).length + '명)</option>'; }).join("");
    var vOk = ids.filter(function(id){ var u = userOf(id); return u && u.d.teamId && !u.d.verifiedAt; }).length;
    var vNo = ids.filter(function(id){ var u = userOf(id); return u && !u.d.teamId && !u.d.verifiedAt; }).length;
    el.innerHTML = '<div style="font-weight:900;margin-bottom:8px">' + ids.length + '명 선택됨 <button class="st-btn ghost sm" type="button" data-act="clear" style="margin-left:6px">선택 해제</button></div>' +
      (vOk ? '<div class="st-row" style="margin-bottom:8px"><button class="st-btn good" type="button" data-act="verify-sel" style="background:#3f7a5c">선택한 학생 출석 확인 (' + vOk + '명)</button>' +
        (vNo ? '<span class="st-muted" style="font-size:12.5px">팀이 없는 ' + vNo + '명은 팀에 넣으면 함께 확인돼요.</span>' : '') + '</div>' : '') +
      '<div class="st-row" style="margin-bottom:8px"><input class="st-in" id="tm-newname" placeholder="새 팀 이름" value="' + esc(suggest) + '" style="margin:0;flex:1 1 160px">' +
      '<label style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700"><input type="checkbox" id="tm-mentor"' + (mChecked ? " checked" : "") + ' style="width:20px;height:20px;accent-color:var(--wine-deep)"> 멘토 있음</label>' +
      '<button class="st-btn" type="button" data-act="new">새 팀 만들기</button></div>' +
      (teams.length ? '<div class="st-row"><select class="st-sel" id="tm-pick">' + opts + '</select><button class="st-btn ghost" type="button" data-act="join">이 팀에 넣기</button></div>' : "");
  }

  function renderTeams(){
    var list = teams.filter(function(t){
      if(!tq) return true;
      var names = (t.d.members || []).map(function(id){ var u = userOf(id); return u ? u.d.name : ""; }).join(" ");
      return (t.d.name + " " + names).toLowerCase().indexOf(tq.toLowerCase()) >= 0;
    }).sort(function(a, b){ return (b.d.createdAt || 0) - (a.d.createdAt || 0); });
    document.getElementById("tm-teamcount").textContent = teams.length + "팀";
    var el = document.getElementById("tm-teams");
    if(!list.length){ el.innerHTML = '<div class="st-muted">' + (teams.length ? "해당하는 팀이 없어요." : "아직 만든 팀이 없어요. 출석한 학생을 골라 팀을 만들어 주세요.") + '</div>'; return; }
    el.innerHTML = list.map(function(t){
      var ms = (t.d.members || []).map(userOf).filter(Boolean);
      var done = ms.filter(function(u){ return P.stampCount(u.d) >= 5; }).length;
      return '<div class="tm-team" data-team="' + esc(t.id) + '" data-drop="team"><div class="hd"><span class="tn">' + esc(t.d.name) + '</span>' +
        (function(){ var mp = ms.some(function(u){ return u.d.role === "멘토"; }); /* 실제로 출석해 팀에 들어온 멘토 기준 */
          return '<span class="st-tag ' + (mp ? "" : "gray") + '">' + (mp ? "멘토 함께" : "멘토 없음") + '</span>'; })() +
        (advisorOf(t) ? '<span class="st-tag gold" title="' + esc(advisorOf(t).note || "") + '">👩‍🏫 ' + esc(advisorOf(t).name) + ' 교수님' + (advisorOf(t).note ? ' · ' + esc(advisorOf(t).note) : '') + '</span>' : '') +
        '<span class="st-tag gray">' + ms.length + '명</span>' +
        '<span class="st-tag ' + (ms.length && done === ms.length ? "ok" : "gray") + '">스탬프 완료 ' + done + '/' + ms.length + '</span>' +
        (t.d.snackAt ? '<span class="st-tag ok">간식 ' + P.hhmm(t.d.snackAt) + '</span>' : "") +
        (t.d.photoAt ? '<span class="st-tag ok">사진 인증</span>' : "") +
        '</div>' +
        '<div>' + ms.map(function(u){
          return '<span class="tm-chip" style="padding-right:10px" draggable="true" data-drag="' + esc(u.id) + '">' + esc(u.d.name) + (u.d.role === "멘토" ? " (멘토)" : "") + ' <span class="st-muted">' + P.stampCount(u.d) + '/5</span></span>';
        }).join("") + '</div></div>';
    }).join("");
  }

  /* ---------- 쓰기 ---------- */
  function assign(ids, teamId){
    var db = P.db, batch = db.batch(), FV = firebase.firestore.FieldValue;
    ids.forEach(function(id){
      var u = userOf(id); if(!u) return;
      if(u.d.teamId && u.d.teamId !== teamId && teamOf(u.d.teamId)) batch.update(db.collection("picnic_teams").doc(u.d.teamId), { members: FV.arrayRemove(id) });
      var up = { teamId: teamId, assignedAt: Date.now(), assignedBy: P.admin.name || "" };
      if(!u.d.verifiedAt){ up.verifiedAt = Date.now(); up.verifiedBy = P.admin.name || ""; }
      batch.update(db.collection("picnic_users").doc(id), up);
    });
    var upd = { members: FV.arrayUnion.apply(FV, ids) };
    if(ids.some(function(id){ var u = userOf(id); return u && u.d.role === "멘토"; })) upd.hasMentor = true; /* 멘토가 들어오면 '멘토 있음'으로 */
    batch.update(db.collection("picnic_teams").doc(teamId), upd);
    return batch.commit();
  }
  function createTeam(name, ids, hasMentor){
    var ref = P.db.collection("picnic_teams").doc();
    return ref.set({ name: name, hasMentor: !!hasMentor, members: [], createdAt: Date.now(), createdBy: P.admin.name || "" })
      .then(function(){ return assign(ids, ref.id); }).then(function(){ return ref.id; });
  }
  var lastList = [];
  function selected(){ return Object.keys(sel).filter(function(k){ return sel[k]; }); }
  function fail(e){ P.toast("저장하지 못했어요: " + (e && e.message ? e.message : e), "bad"); console.warn(e); }

  document.addEventListener("click", function(e){
    var pf = e.target.closest("[data-pf]");
    if(pf){ preFilter = pf.dataset.pf; renderPre(); return; }
    var f = e.target.closest("[data-f]");
    if(f){ filter = f.dataset.f; document.querySelectorAll("#tm-filter button").forEach(function(b){ b.classList.toggle("on", b === f); }); render(); return; }
    var vb = e.target.closest("[data-verify]");
    if(vb){
      e.preventDefault(); /* label 안 버튼 — 체크박스가 같이 눌리지 않게 */
      var vu = userOf(vb.dataset.verify); if(!vu) return;
      vb.disabled = true;
      P.db.collection("picnic_users").doc(vu.id).update({ verifiedAt: Date.now(), verifiedBy: P.admin.name || "" })
        .then(function(){ P.toast(vu.d.name + " 님 출석 확인", "ok"); }).catch(fail);
      return;
    }
    var a = e.target.closest("[data-act]");
    if(a){
      var act = a.dataset.act, ids2 = selected();
      if(act === "clear"){ sel = {}; render(); return; }
      if(act === "sel-all"){ (lastList || []).forEach(function(id){ sel[id] = true; }); render(); return; }
      if(act === "verify-sel"){
        var vids = ids2.filter(function(id){ var u = userOf(id); return u && u.d.teamId && !u.d.verifiedAt; });
        if(!vids.length) return;
        if(vids.length > 1 && !confirm(vids.length + "명을 한 번에 출석 확인할까요? (학생 화면을 확인했는지 꼭 확인해 주세요)")) return;
        a.disabled = true;
        var vb2 = P.db.batch(), vnow = Date.now();
        vids.forEach(function(id){ vb2.update(P.db.collection("picnic_users").doc(id), { verifiedAt: vnow, verifiedBy: P.admin.name || "" }); });
        vb2.commit().then(function(){ vids.forEach(function(id){ delete sel[id]; }); P.toast(vids.length + "명 출석 확인 완료", "ok"); render(); }).catch(fail);
        return;
      }
      if(act === "auto-toggle"){ P.db.collection("picnic_config").doc("main").set({ autoAssign: !autoOn() }, { merge: true }).catch(fail); return; }
      if(act === "new"){
        var name = (document.getElementById("tm-newname").value || "").trim();
        if(!name){ P.toast("새 팀 이름을 적어 주세요.", "bad"); return; }
        if(teams.some(function(t){ return t.d.name === name; }) && !confirm("[" + name + "] 이름의 팀이 이미 있어요. 그래도 새 팀을 만들까요?")) return;
        a.disabled = true;
        createTeam(name, ids2, (document.getElementById("tm-mentor") || {}).checked).then(function(){ sel = {}; P.toast("[" + name + "] 팀을 만들고 " + ids2.length + "명 배정했어요", "ok"); render(); }).catch(fail);
        return;
      }
      if(act === "join"){
        var tid = document.getElementById("tm-pick").value, t = teamOf(tid);
        a.disabled = true;
        assign(ids2, tid).then(function(){ sel = {}; P.toast("[" + (t ? t.d.name : "") + "] 팀에 " + ids2.length + "명 배정했어요", "ok"); render(); }).catch(fail);
        return;
      }
    }
  });
  /* ---------- 마우스로 끌어서 팀 배정 ---------- */
  var dragIds = null;
  document.addEventListener("dragstart", function(e){
    var el = e.target.closest && e.target.closest("[data-drag]"); if(!el) return;
    var id = el.dataset.drag;
    var picked = selected();
    dragIds = picked.indexOf(id) >= 0 ? picked : [id];   /* 체크한 학생을 끌면 체크한 사람 모두 */
    try{ e.dataTransfer.setData("text/plain", dragIds.join(",")); e.dataTransfer.effectAllowed = "move"; }catch(x){}
    el.classList.add("tm-dragging");
  });
  document.addEventListener("dragend", function(e){
    document.querySelectorAll(".tm-dragging,.drop-on").forEach(function(x){ x.classList.remove("tm-dragging"); x.classList.remove("drop-on"); });
  });
  document.addEventListener("dragover", function(e){
    var t = e.target.closest && e.target.closest("[data-drop]"); if(!t || !dragIds) return;
    e.preventDefault(); try{ e.dataTransfer.dropEffect = "move"; }catch(x){}
    document.querySelectorAll(".drop-on").forEach(function(x){ if(x !== t) x.classList.remove("drop-on"); });
    t.classList.add("drop-on");
  });
  document.addEventListener("dragleave", function(e){
    var t = e.target.closest && e.target.closest("[data-drop]");
    if(t && !t.contains(e.relatedTarget)) t.classList.remove("drop-on");
  });
  document.addEventListener("drop", function(e){
    var t = e.target.closest && e.target.closest("[data-drop]"); if(!t || !dragIds) return;
    e.preventDefault();
    t.classList.remove("drop-on");
    var ids = dragIds.filter(function(id){ return !!userOf(id); }); dragIds = null;
    if(!ids.length) return;
    if(t.dataset.drop === "team"){
      var team = teamOf(t.dataset.team); if(!team) return;
      ids = ids.filter(function(id){ return userOf(id).d.teamId !== team.id; });
      if(!ids.length) return;
      assign(ids, team.id).then(function(){ ids.forEach(function(id){ delete sel[id]; }); P.toast("[" + team.d.name + "] 팀에 " + ids.length + "명 배정했어요", "ok"); render(); }).catch(fail);
      return;
    }
    /* 새 팀 만들기 칸 */
    var first = userOf(ids[0]);
    var name = prompt("새 팀 이름 (" + ids.length + "명)", first ? (first.d.team || first.d.teamName || "") : "");
    if(!name || !name.trim()) return;
    name = name.trim();
    var hasMentor = ids.some(function(id){ var u = userOf(id); return u && u.d.role === "멘토"; });
    createTeam(name, ids, hasMentor).then(function(){ ids.forEach(function(id){ delete sel[id]; }); P.toast("[" + name + "] 팀을 만들고 " + ids.length + "명 배정했어요", "ok"); render(); }).catch(fail);
  });

  document.addEventListener("change", function(e){
    var s = e.target.closest && e.target.closest("[data-sel]");
    if(s){ sel[s.dataset.sel] = s.checked; renderList(users.filter(function(u){ return u.d.attendAt; })); renderAction(); }
  });
  document.addEventListener("input", function(e){
    if(e.target.id === "tm-q"){ q = e.target.value.trim(); render(); }
    if(e.target.id === "tm-tq"){ tq = e.target.value.trim(); renderTeams(); }
  });

  P.boot({ title: "PICNIC DAY 출석 확인·팀 배정", onReady: function(){
    P.db.collection("picnic_users").onSnapshot(function(s){
      users = s.docs.map(function(d){ return { id: d.id, d: d.data() }; });
      Object.keys(sel).forEach(function(k){ var u = userOf(k); if(!u || (filter === "wait" && u.d.teamId) || (filter === "check" && u.d.verifiedAt)) delete sel[k]; });
      render(); runAuto();
    }, fail);
    P.db.collection("picnic_config").doc("main").onSnapshot(function(s){ cfg = s.exists ? (s.data() || {}) : {}; render(); runAuto(); }, function(){});
    P.db.collection("team_roster").onSnapshot(function(s){ roster = s.docs.map(function(d){ return d.data(); }); render(); runAuto(); }, fail);
    P.db.collection("picnic_teams").onSnapshot(function(s){ teams = s.docs.map(function(d){ return { id: d.id, d: d.data() }; }); render(); }, fail);
    /* 사전 신청자: 투표 중 '피크닉데이 참석 확인' (참석/불참) */
    P.db.collection("polls").get().then(function(ps){
      var poll = ps.docs.filter(function(d){ var t = String(d.data().title || ""); return t.indexOf("피크닉") >= 0 && t.indexOf("참석") >= 0; })[0];
      if(!poll) return;
      P.db.collection("poll_votes").where("pollId", "==", poll.id).onSnapshot(function(s){
        pre = s.docs.map(function(d){ return d.data(); }).filter(function(v){ return v.choice === "참석"; });
        renderPre();
      }, function(){});
    }).catch(function(){});
  }});
})();
</script>
</body>
</html>
