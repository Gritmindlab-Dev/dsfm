<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DS-FM 운영진 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --wine:#7c1f3d; --wine-deep:#4c1226; --wine-soft:#a8446a;
    --blush:#f3d9e0; --cream:#fbf5f1; --paper:#ffffff;
    --ink:#2a1e22; --ink-soft:#8a737a; --line:#ecdde1;
    --gold:#b6893f; --good:#3f7a5c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream); color:var(--ink); font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif; word-break:keep-all; -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}

  #login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:radial-gradient(1200px 700px at 50% -12%, #fdf1f3 0%, var(--blush) 62%);}
  .login-card{width:100%; max-width:360px; background:var(--paper); border-radius:18px; padding:30px 26px; box-shadow:0 20px 50px rgba(42,30,34,.14);}
  .login-card h1{font-size:19px; margin:0 0 4px; color:var(--wine-deep);}
  .login-card .sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:20px;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
  .field label{font-size:11.5px; color:var(--ink-soft); font-weight:700;}
  .field input{border:1.5px solid var(--line); border-radius:10px; padding:12px 13px; font-size:16px; font-family:inherit; outline:0; background:var(--cream); color:var(--ink);}
  .field input:focus{border-color:var(--wine-soft); background:var(--paper);}
  .login-submit{all:unset; box-sizing:border-box; cursor:pointer; width:100%; text-align:center; margin-top:8px; background:var(--wine-deep); color:#fff; font-weight:700; font-size:15px; padding:13px; border-radius:11px;}
  .login-submit:hover{background:var(--wine);}
  .login-error{margin-top:12px; font-size:12.5px; color:#b23b3b; background:#fbe8e8; border-radius:9px; padding:9px 11px; display:none;}
  .login-note{font-size:11.5px; color:var(--ink-soft); margin-top:16px; line-height:1.6;}
  .login-note a{color:var(--wine-deep); font-weight:700;}
  /* ================= 운영진(관리자) 화면 ================= */
  #admin-root{min-height:100vh; background:var(--cream); color:var(--ink);}
  .adm-top{
    background:linear-gradient(120deg, var(--wine-deep), var(--wine)); color:#fff;
    padding:16px 22px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .adm-brand{font-weight:700; font-size:16px;}
  .adm-who{font-size:11.5px; color:rgba(255,255,255,.7); margin-top:2px;}
  .adm-top-btn{
    all:unset; box-sizing:border-box; cursor:pointer; border:1px solid rgba(255,255,255,.45); border-radius:999px;
    padding:7px 15px; font-size:12.5px; font-weight:700; color:#fff;
  }
  .adm-top-btn:hover{background:rgba(255,255,255,.12);}
  .adm-tabs{
    display:flex; gap:6px; padding:12px 22px; background:var(--paper); border-bottom:1px solid var(--line);
    overflow-x:auto; position:sticky; top:0; z-index:20;
  }
  .adm-tab{
    all:unset; box-sizing:border-box; cursor:pointer; white-space:nowrap; padding:8px 14px; border-radius:999px;
    font-size:13px; font-weight:700; color:var(--ink-soft); background:var(--cream); display:flex; align-items:center; gap:6px;
  }
  .adm-tab.active{background:var(--wine-deep); color:#fff;}
  .adm-tab .adm-count{
    font-size:10.5px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; display:inline-flex;
    align-items:center; justify-content:center; background:var(--wine); color:#fff;
  }
  .adm-tab.active .adm-count{background:#fff; color:var(--wine-deep);}
  .adm-scope{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 22px; font-size:12.5px;
    background:#fffaf2; border-bottom:1px solid var(--line); color:var(--ink);
  }
  .adm-scope b{color:var(--wine-deep);}
  .adm-main{max-width:1040px; margin:0 auto; padding:24px 22px 70px;}
  .adm-h{font-size:21px; font-weight:700; margin:0;}
  .adm-desc{font-size:13px; color:var(--ink-soft); margin-top:5px; line-height:1.6;}
  .adm-card{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-top:16px;}
  .adm-card-title{font-size:14px; font-weight:700; margin-bottom:12px;}
  .adm-stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin-top:16px;}
  .adm-stat{
    all:unset; box-sizing:border-box; cursor:pointer; background:var(--paper); border:1px solid var(--line);
    border-radius:14px; padding:14px 16px; display:block;
  }
  .adm-stat:hover{border-color:var(--wine-soft);}
  .adm-stat.alert{border-color:var(--wine); background:#fdf4f6;}
  .adm-stat-label{font-size:12px; color:var(--ink-soft);}
  .adm-stat-value{font-size:24px; font-weight:700; color:var(--wine-deep); margin-top:4px;}
  .adm-stat-sub{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .adm-form{display:grid; gap:10px;}
  .adm-form-row{display:flex; gap:10px; flex-wrap:wrap;}
  .adm-form-row > *{flex:1 1 160px; min-width:0;}
  .adm-input, .adm-select, .adm-textarea{
    box-sizing:border-box; width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:14px; font-family:inherit; outline:0; background:var(--cream); color:var(--ink);
  }
  .adm-input:focus, .adm-select:focus, .adm-textarea:focus{border-color:var(--wine-soft); background:var(--paper);}
  .adm-textarea{min-height:90px; resize:vertical; line-height:1.6;}
  .adm-check{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink); cursor:pointer;}
  .adm-check input{accent-color:var(--wine-deep); width:16px; height:16px;}
  .adm-actions{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
  .adm-btn{
    all:unset; box-sizing:border-box; cursor:pointer; padding:9px 18px; border-radius:10px; font-size:13px; font-weight:700;
    background:var(--wine-deep); color:#fff; text-align:center;
  }
  .adm-btn:hover{background:var(--wine);}
  .adm-btn.ghost{background:var(--paper); color:var(--wine-deep); border:1.5px solid var(--line);}
  .adm-btn.ghost:hover{border-color:var(--wine-soft); background:var(--blush);}
  .adm-btn.small{padding:6px 11px; font-size:12px; border-radius:8px;}
  .adm-btn.good{background:var(--good);}
  .adm-btn.bad{background:#b23b3b;}
  .adm-list{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .adm-item{background:var(--paper); border:1px solid var(--line); border-radius:13px; padding:13px 15px;}
  .adm-item.pinned{border-left:3px solid var(--wine);}
  .adm-item-top{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .adm-item-title{font-size:14px; font-weight:700;}
  .adm-item-text{font-size:13px; line-height:1.65; margin-top:6px; white-space:pre-wrap; word-break:break-word;}
  .adm-item-meta{font-size:11.5px; color:var(--ink-soft); margin-top:7px;}
  .adm-item-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .adm-tag{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--blush); color:var(--wine-deep);}
  .adm-tag.gold{background:#f7ecd9; color:#8a5a1f;}
  .adm-tag.green{background:#e3efe8; color:var(--good);}
  .adm-tag.red{background:#fbe8e8; color:#b23b3b;}
  .adm-tag.gray{background:var(--cream); color:var(--ink-soft); border:1px solid var(--line);}
  .adm-empty{font-size:13px; color:var(--ink-soft); text-align:center; padding:28px 0;}
  .adm-filters{display:flex; gap:6px; flex-wrap:wrap; margin-top:14px;}
  .adm-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; margin-top:14px;}
  .adm-grid .adm-item{padding:0; overflow:hidden;}
  .adm-grid img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--blush);}
  .adm-grid .adm-item-body{padding:11px 13px;}
  .adm-table-wrap{overflow-x:auto; margin-top:12px;}
  .adm-table{width:100%; border-collapse:collapse; font-size:13px;}
  .adm-table th, .adm-table td{padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap;}
  .adm-table th{font-size:11.5px; color:var(--ink-soft); font-weight:700; background:var(--cream);}
  .adm-note{
    margin-top:14px; padding:11px 14px; border-radius:11px; background:#faf1e8; color:#8a5a1f; font-size:12px;
    line-height:1.6; border:1px solid #f0dcc4;
  }
  .adm-reply{margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;}
  .adm-reply .adm-input{flex:1 1 200px; padding:8px 10px; font-size:13px;}
  .adm-reply .adm-select{flex:0 0 120px; padding:8px 10px; font-size:13px;}
  .login-admin-link{
    all:unset; box-sizing:border-box; cursor:pointer; display:block; width:100%; text-align:center; margin-top:12px;
    font-size:12px; font-weight:700; color:var(--wine-deep); padding:9px; border-radius:10px; border:1.5px dashed var(--line);
  }
  .login-admin-link:hover{background:var(--blush);}
  @media (max-width:760px){
    .adm-top{padding:14px 16px;}
    .adm-tabs{padding:10px 16px;}
    .adm-scope{padding:10px 16px;}
    .adm-main{padding:18px 16px 60px;}
    .adm-actions .adm-btn{flex:1 1 auto;}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>DS-FM 운영진 페이지</h1>
    <div class="sub" id="login-sub">이름, 휴대폰 뒷자리 4자리, 비밀번호를 입력해주세요.</div>
    <form id="login-form" onsubmit="return false">
      <div id="pin-fields">
        <div class="field"><label for="admin-name">이름</label><input type="text" id="admin-name" autocomplete="username"></div>
        <div class="field"><label for="admin-pin">휴대폰 뒷자리 4자리</label><input type="tel" id="admin-pin" inputmode="numeric" maxlength="4"></div>
      </div>
      <div id="email-fields" style="display:none">
        <div class="field"><label for="admin-email">이메일</label><input type="email" id="admin-email"></div>
      </div>
      <div class="field"><label for="admin-password">비밀번호</label><input type="password" id="admin-password" autocomplete="current-password"></div>
      <button class="login-submit" id="login-submit" type="button">로그인</button>
    </form>
    <div class="login-error" id="login-error"></div>
    <div class="login-note">
      운영진 계정은 총괄 관리자가 등록해요. 비밀번호를 모르면 총괄 관리자에게 문의해주세요.<br>
      <a href="../">← 학생용 사이트로</a> · <a href="#" id="mode-toggle" style="font-weight:400;color:var(--ink-soft)">사이트 관리자 이메일 로그인</a>
    </div>
  </div>
</div>

<div id="admin-root" style="display:none"></div>

<script>
/* ================= DS-FM 운영진(관리자) 화면 =================
   db: Firestore 형태의 객체 (collection().onSnapshot / add / doc(id).update / delete)
   opts: { whoami, exitLabel, onExit, demoNote } */
(function(){
  "use strict";

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtTime(ts){
    if(!ts) return "";
    var diff = Date.now() - ts, m = Math.floor(diff/60000);
    if(m < 1) return "방금 전";
    if(m < 60) return m + "분 전";
    var h = Math.floor(m/60);
    if(h < 24) return h + "시간 전";
    var d = new Date(ts);
    return (d.getMonth()+1) + "." + d.getDate() + " " + d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  function byNewest(a, b){ return (b.d.createdAt || 0) - (a.d.createdAt || 0); }
  function csvCell(v){ v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
  function downloadCsv(filename, rows){
    var text = "﻿" + rows.map(function(r){ return r.map(csvCell).join(","); }).join("\n");
    try{
      var blob = new Blob([text], {type:"text/csv;charset=utf-8"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }catch(e){ alert("이 화면에서는 파일 내려받기가 지원되지 않아요."); }
  }

  var TABS = [
    {key:"dash",    label:"한눈에 보기"},
    {key:"notice",  label:"공지 관리"},
    {key:"sched",   label:"일정 관리"},
    {key:"verify",  label:"인증 승인"},
    {key:"suggest", label:"건의함"},
    {key:"posts",   label:"게시물 관리"},
    {key:"vote",    label:"출석 투표"},
    {key:"roster",  label:"멘토·멘티 명단"},
    {key:"accounts",label:"운영진 계정", superOnly:true}
  ];
  var COLLS = ["announcements","sched_events","verify_posts","suggestion_posts","private_posts","photo_posts","team_posts","attendance_votes","team_roster","login_keys"];
  var DEFAULT_COLLEGES = ["글로벌융합대학","아트앤디자인대학","과학기술대학","자유전공학부"];
  function keyFor(name, pin){
    var text = "dsfm|" + String(name).replace(/\s+/g, "") + "|" + String(pin).replace(/\D/g, "");
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0" + b.toString(16)).slice(-2); }).join("");
    });
  }
  var SUGGEST_STATUS = ["접수","검토중","반영완료","보류"];
  var NOTICE_TAGS = ["운영진 공지","전체 이벤트","공통 마감","안내"];

  function mount(host, db, opts){
    opts = opts || {};
    /* 화면을 다시 띄울 때 이벤트가 겹치지 않도록, 매번 새 컨테이너에 그려요 */
    host.innerHTML = "";
    var root = document.createElement("div");
    host.appendChild(root);
    var S = {}; COLLS.concat(["admins"]).forEach(function(c){ S[c] = []; });
    /* 권한: 총괄 = 전체, 운영 = 자기 단과대만 */
    var isSuper = opts.role !== "운영";
    var myCollege = opts.college || "";
    var COLLEGES = opts.colleges || DEFAULT_COLLEGES;
    var collegeFilter = isSuper ? "전체" : myCollege;
    function inScope(d){ return isSuper ? (collegeFilter === "전체" || d.college === collegeFilter) : d.college === myCollege; }
    function sharedVisible(d){
      if(!d.college || d.college === "전체") return true;
      return isSuper ? (collegeFilter === "전체" || d.college === collegeFilter) : d.college === myCollege;
    }
    function canEdit(d){ return isSuper || (d.college && d.college === myCollege); }
    function scoped(name){ return S[name].filter(function(x){ return inScope(x.d); }); }
    function collegeOptions(sel, withAll){
      return (withAll ? ['<option value="전체"' + (sel === "전체" ? " selected" : "") + '>전체 (모든 단과대)</option>'] : []).concat(COLLEGES.map(function(c){
        return '<option' + (sel === c ? " selected" : "") + '>' + esc(c) + '</option>';
      })).join("");
    }
    function targetField(id, current){
      if(isSuper) return '<select class="adm-select" id="' + id + '" style="flex:0 1 200px">' + collegeOptions(current || "전체", true) + '</select>';
      return '<input class="adm-input" id="' + id + '" value="' + esc(myCollege) + '" disabled style="flex:0 1 200px">';
    }
    var errors = {};
    var tab = "dash";
    var verifyFilter = "확인중";
    var postsBoard = "private_posts";
    var editingNoticeId = null;
    var unsubs = [];

    function col(name){ return db.collection(name); }
    function act(p){ if(p && p.catch) p.catch(function(e){ alert("저장하지 못했어요: " + (e && e.message ? e.message : e)); }); }

    root.innerHTML =
      '<div class="adm-top">' +
        '<div><div class="adm-brand">DS-FM 공유공간 · ' + (isSuper ? "총괄 관리자" : "운영 관리자 · " + esc(myCollege)) + '</div><div class="adm-who">' + esc(opts.whoami || "") + '</div></div>' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        (opts.onRoleChange ? '<select class="adm-select" id="adm-role-switch" style="width:auto;padding:7px 10px;font-size:12.5px;background:rgba(255,255,255,.95)">' +
          '<option value="총괄"' + (isSuper ? " selected" : "") + '>총괄 관리자 시점</option>' +
          COLLEGES.map(function(c){ return '<option value="' + esc(c) + '"' + (!isSuper && myCollege === c ? " selected" : "") + '>운영 관리자 · ' + esc(c) + '</option>'; }).join("") +
        '</select>' : "") +
        (opts.adminLogin && opts.adminLogin.canChangeOwn ? '<button class="adm-top-btn" type="button" data-adm="mypw">비밀번호 변경</button>' : "") +
        '<button class="adm-top-btn" type="button" data-adm="exit">' + esc(opts.exitLabel || "나가기") + '</button></div>' +
      '</div>' +
      '<nav class="adm-tabs" id="adm-tabs"></nav>' +
      '<div class="adm-scope">' + (isSuper ?
        '<span>보기 범위</span><select class="adm-select" id="adm-scope-select" style="width:auto;padding:6px 10px;font-size:13px">' + collegeOptions("전체", true) + '</select>' :
        '<span>담당 범위</span><b>' + esc(myCollege) + '</b><span style="color:var(--ink-soft)">· 우리 단과대 글·명단만 보이고 관리할 수 있어요</span>') + '</div>' +
      '<main class="adm-main" id="adm-main"></main>';
    var tabsEl = root.querySelector("#adm-tabs");
    var mainEl = root.querySelector("#adm-main");

    function counts(){
      return {
        verify: scoped("verify_posts").filter(function(x){ return (x.d.status || "확인중") === "확인중"; }).length,
        suggest: scoped("suggestion_posts").filter(function(x){ return !x.d.status || x.d.status === "접수"; }).length
      };
    }
    function renderTabs(){
      var c = counts();
      tabsEl.innerHTML = TABS.filter(function(t){ return isSuper || !t.superOnly; }).map(function(t){
        var n = t.key === "verify" ? c.verify : t.key === "suggest" ? c.suggest : 0;
        return '<button type="button" class="adm-tab' + (t.key === tab ? " active" : "") + '" data-tab="' + t.key + '">' +
          esc(t.label) + (n ? '<span class="adm-count">' + n + '</span>' : "") + '</button>';
      }).join("");
    }

    /* ---------- 각 탭 ---------- */
    function viewDash(){
      var c = counts();
      var votesS = scoped("attendance_votes");
      var attend = votesS.filter(function(x){ return x.d.choice === "attend"; }).length;
      var absent = votesS.filter(function(x){ return x.d.choice === "absent"; }).length;
      var teams = {};
      function bump(t, k){ t = t || "(반 미지정)"; teams[t] = teams[t] || {posts:0, verify:0, approved:0, roster:0, votes:0}; teams[t][k]++; }
      scoped("team_posts").forEach(function(x){ bump(x.d.team, "posts"); });
      scoped("verify_posts").forEach(function(x){ bump(x.d.team, "verify"); if(x.d.status === "승인") bump(x.d.team, "approved"); });
      scoped("team_roster").forEach(function(x){ bump(x.d.teamKey || x.d.team, "roster"); });
      votesS.forEach(function(x){ bump(x.d.team, "votes"); });
      var teamNames = Object.keys(teams).sort(function(a,b){ return a.localeCompare(b, "ko", {numeric:true}); });
      var html = '<h2 class="adm-h">한눈에 보기</h2>' +
        '<p class="adm-desc">처리할 일과 활동 현황을 모아봤어요. 카드를 누르면 해당 메뉴로 이동해요.</p>' +
        '<div class="adm-stats">' +
          stat("verify", "인증 승인 대기", c.verify, "건", c.verify > 0) +

    function addMember(p){
      var teamKey = p.college + " " + p.team;
      return keyFor(p.name, p.pin).then(function(key){
        return col("login_keys").doc(key).get().then(function(snap){
          var exists = snap && (typeof snap.exists === "function" ? snap.exists() : snap.exists);
          if(exists) return "같은 이름과 휴대폰 뒷자리로 이미 등록돼 있어요.";
          return col("team_roster").add({ college: p.college, team: p.team, teamKey: teamKey, name: p.name, role: p.role, major: p.major || "", createdAt: Date.now() })
            .then(function(ref){
              return col("login_keys").doc(key).set({ rosterId: ref.id, name: p.name, college: p.college, team: p.team, teamKey: teamKey, role: p.role, createdAt: Date.now() });
            }).then(function(){ return ""; });
        });
      }).catch(function(e){ return "저장하지 못했어요 (" + (e && e.message ? e.message : e) + ")"; });
    }

    /* ---------- 이벤트 ---------- */
    root.addEventListener("change", function(e){
      if(e.target.id === "adm-scope-select"){ collegeFilter = e.target.value; render(true); }
      if(e.target.id === "adm-role-switch" && opts.onRoleChange){ opts.onRoleChange(e.target.value); }
      if(e.target.id === "adm-a-role"){ var cs = root.querySelector("#adm-a-college"); if(cs) cs.disabled = e.target.value === "총괄"; }
    });
    root.addEventListener("click", function(e){
      var t = e.target.closest("[data-tab]");
      if(t && root.contains(t)){ go(t.dataset.tab); return; }
      var vf = e.target.closest("[data-vfilter]");
      if(vf){ verifyFilter = vf.dataset.vfilter; viewVerify(); return; }
      var bd = e.target.closest("[data-board]");
      if(bd){ postsBoard = bd.dataset.board; viewPosts(); return; }
      var b = e.target.closest("[data-adm]");
      if(!b) return;
      var a = b.dataset.adm;
      var item = b.closest("[data-id]");
      var id = item ? item.dataset.id : null;
      function find(c){ return S[c].filter(function(x){ return x.id === id; })[0]; }

      if(a === "exit"){ if(opts.onExit) opts.onExit(); return; }
      if(a === "notice-save"){
        var label = root.querySelector("#adm-n-label").value.trim();
        var detail = root.querySelector("#adm-n-detail").value.trim();
        if(!label){ alert("공지 제목을 입력해주세요."); return; }
        var data = { college: isSuper ? root.querySelector("#adm-n-college").value : myCollege, tag: root.querySelector("#adm-n-tag").value, label: label, detail: detail, pinned: root.querySelector("#adm-n-pin").checked };
        if(editingNoticeId){ act(col("announcements").doc(editingNoticeId).update(data)); }
        else { data.createdAt = Date.now(); data.readBy = []; act(col("announcements").add(data)); }
        editingNoticeId = null; document.activeElement && document.activeElement.blur(); viewNotice(); return;
      }
      if(a === "notice-cancel"){ editingNoticeId = null; viewNotice(); return; }
      if(a === "notice-edit"){ editingNoticeId = id; viewNotice(); window.scrollTo(0,0); return; }
      if(a === "notice-pin"){ var n = find("announcements"); if(n) act(col("announcements").doc(id).update({pinned: !n.d.pinned})); return; }
      if(a === "notice-reads"){
        var n2 = find("announcements"); var r = (n2 && n2.d.readBy) || [];
        alert(r.length ? "확인한 사람 (" + r.length + "명)\n\n" + r.map(function(k){ var p = String(k).split("__"); return (p[1] ? p[1] + " " : "") + p[0]; }).join("\n") : "아직 확인한 사람이 없어요.");
        return;
      }
      if(a === "notice-del"){ if(confirm("이 공지를 삭제할까요?")) act(col("announcements").doc(id).delete()); return; }
      if(a === "notice-import"){
        (opts.defaultNotices || []).forEach(function(n, i){
          act(col("announcements").add({ college: "전체", tag: n.tag, label: n.label, detail: n.detail, pinned: false, readBy: [], createdAt: Date.now() - i * 1000 }));
        });
        return;
      }
      if(a === "event-add"){
        var date = root.querySelector("#adm-e-date").value, title = root.querySelector("#adm-e-title").value.trim();
        if(!date || !title){ alert("날짜와 제목을 입력해주세요."); return; }
        act(col("sched_events").add({ date: date, title: title, college: isSuper ? root.querySelector("#adm-e-college").value : myCollege, createdAt: Date.now() }));
        root.querySelector("#adm-e-title").value = ""; b.blur(); return;
      }
      if(a === "event-del"){ if(confirm("이 일정을 삭제할까요?")) act(col("sched_events").doc(id).delete()); return; }
      if(a === "v-approve" || a === "v-reject" || a === "v-reset"){
        act(col("verify_posts").doc(id).update({ status: a === "v-approve" ? "승인" : a === "v-reject" ? "반려" : "확인중" })); return;
      }
      if(a === "s-save"){
        var st = item.querySelector('[data-field="status"]').value, rp = item.querySelector('[data-field="reply"]').value.trim();
        act(col("suggestion_posts").doc(id).update({ status: st, reply: rp, repliedAt: Date.now() }));
        b.textContent = "저장됨 ✓"; setTimeout(function(){ document.activeElement && document.activeElement.blur(); render(); }, 700); return;
      }
      if(a === "s-del"){ if(confirm("이 건의를 삭제할까요?")) act(col("suggestion_posts").doc(id).delete()); return; }
      if(a === "post-del"){ if(confirm("이 글을 삭제할까요? 되돌릴 수 없어요.")) act(col(postsBoard).doc(id).delete()); return; }
      if(a === "roster-add"){
        var rc = isSuper ? root.querySelector("#adm-r-college").value : myCollege;
        var person = { college: rc, team: root.querySelector("#adm-r-team").value.trim(), name: root.querySelector("#adm-r-name").value.trim(),
          role: root.querySelector("#adm-r-role").value, pin: root.querySelector("#adm-r-pin").value.replace(/\D/g, ""), major: root.querySelector("#adm-r-major").value.trim() };
        if(!person.team || !person.name){ alert("팀과 이름을 입력해주세요."); return; }
        if(person.pin.length !== 4){ alert("휴대폰 번호 뒷자리 4자리를 입력해주세요."); return; }
        addMember(person).then(function(msg){
          if(msg){ alert(msg); return; }
          root.querySelector("#adm-r-name").value = ""; root.querySelector("#adm-r-pin").value = ""; root.querySelector("#adm-r-major").value = "";
          root.querySelector("#adm-r-name").focus();
        });
        return;
      }
      if(a === "roster-bulk"){
        var lines = root.querySelector("#adm-r-bulk").value.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
        var people = [], skipped = [];
        lines.forEach(function(l){
          var r = l.split(/\t|,/).map(function(x){ return x.trim(); });
          if(/단과|소속/.test(r[0]) || r[2] === "이름") return;
          var person = { college: r[0], team: r[1], name: r[2], role: /멘토/.test(r[3] || "") ? "멘토" : "멘티", pin: String(r[4] || "").replace(/\D/g, "").slice(-4), major: r[5] || "" };
          if(!person.college || !person.team || !person.name || person.pin.length !== 4){ skipped.push(l + "  ← 칸이 비었거나 뒷자리가 4자리가 아님"); return; }
          if(COLLEGES.indexOf(person.college) < 0){ skipped.push(l + "  ← 단과대 이름 확인 (" + COLLEGES.join(", ") + ")"); return; }
          if(!isSuper && person.college !== myCollege){ skipped.push(l + "  ← 담당 단과대가 아님"); return; }
          people.push(person);
        });
        if(!people.length){ alert("등록할 명단이 없어요." + (skipped.length ? "\n\n건너뛴 줄:\n" + skipped.slice(0, 10).join("\n") : "")); return; }
        if(!confirm(people.length + "명을 등록할까요?" + (skipped.length ? "\n(건너뛸 줄 " + skipped.length + "개)" : ""))) return;
        var prog = root.querySelector("#adm-r-progress"), done = 0, warns = [], finished = 0, idx = 0;
        /* 여러 명을 동시에(6명씩) 등록해서 1,000명도 몇 분 안에 끝나요 */
        function worker(){
          if(idx >= people.length) return Promise.resolve();
          var pp = people[idx++];
          return addMember(pp).then(function(msg){
            if(msg) warns.push(pp.college + " " + pp.team + " " + pp.name + ": " + msg); else done++;
            finished++;
            prog.textContent = "등록 중… " + finished + " / " + people.length + " (창을 닫지 마세요)";
            return worker();
          });
        }
        var pool = []; for(var w = 0; w < 6; w++) pool.push(worker());
        Promise.all(pool).then(function(){
          prog.textContent = "";
          root.querySelector("#adm-r-bulk").value = "";
          alert(done + "명 등록했어요." + (warns.length ? "\n\n확인이 필요한 사람 (" + warns.length + "명):\n" + warns.slice(0, 20).join("\n") : "") + (skipped.length ? "\n\n건너뛴 줄:\n" + skipped.slice(0, 15).join("\n") : ""));
          render(true);
        });
        return;
      }
      if(a === "roster-del"){
        if(!confirm("명단에서 삭제할까요? 이 사람은 더 이상 로그인할 수 없어요.")) return;
        S.login_keys.filter(function(k){ return k.d.rosterId === id; }).forEach(function(k){ act(col("login_keys").doc(k.id).delete()); });
        act(col("team_roster").doc(id).delete());
        return;

      if(a === "mypw"){ go("mypw"); return; }
      if(a === "mypw-save"){
        var p1 = root.querySelector("#adm-pw-1").value, p2 = root.querySelector("#adm-pw-2").value, msgEl = root.querySelector("#adm-pw-msg");
        if(p1.length < 6){ msgEl.textContent = "비밀번호는 6자 이상이어야 해요."; return; }
        if(p1 !== p2){ msgEl.textContent = "두 비밀번호가 달라요."; return; }
        b.disabled = true; msgEl.textContent = "바꾸는 중…";
        opts.adminLogin.changeOwn(p1).then(function(){ msgEl.textContent = "바꿨어요. 다음 로그인부터 새 비밀번호를 쓰세요."; root.querySelector("#adm-pw-1").value = ""; root.querySelector("#adm-pw-2").value = ""; })
          .catch(function(e){ msgEl.textContent = (e && e.code === "auth/requires-recent-login") ? "보안을 위해 로그아웃했다가 다시 로그인한 뒤 바꿔주세요." : "바꾸지 못했어요: " + (e && e.message ? e.message : e); })
          .then(function(){ b.disabled = false; });
        return;
      }
      if(a === "account-add" && opts.adminLogin){
        var nm = root.querySelector("#adm-a-name").value.replace(/\s+/g, "");
        var pin = root.querySelector("#adm-a-pin").value.replace(/\D/g, "");
        var role2 = root.querySelector("#adm-a-role").value;
        var pw = root.querySelector("#adm-a-pw").value;
        if(!nm){ alert("이름을 입력해주세요."); return; }
        if(pin.length !== 4){ alert("휴대폰 뒷자리 4자리를 입력해주세요."); return; }
        if(pw.length < 6){ alert("처음 비밀번호는 6자 이상이어야 해요."); return; }
        b.disabled = true; b.textContent = "추가 중…";
        opts.adminLogin.create({ name: nm, pin: pin, role: role2, college: role2 === "운영" ? root.querySelector("#adm-a-college").value : "", password: pw })
          .then(function(){ alert(nm + " 님을 추가했어요.\n로그인: 이름 " + nm + " / 뒷자리 " + pin + " / 처음 비밀번호"); viewAccounts(); })
          .catch(function(e){ alert("추가하지 못했어요: " + (e && e.message ? e.message : e)); b.disabled = false; b.textContent = "추가"; });
        return;
      }
      if(a === "account-reset"){
        var ad = find("admins"); var npw = item.querySelector('[data-role="newpw"]').value;
        if(!ad) return;
        if(npw.length < 6){ alert("새 비밀번호는 6자 이상이어야 해요."); return; }
        b.disabled = true; b.textContent = "만드는 중…";
        opts.adminLogin.reset(ad, npw).then(function(){ alert((ad.d.name || "") + " 님의 비밀번호를 새로 만들었어요."); viewAccounts(); })
          .catch(function(e){ alert("만들지 못했어요: " + (e && e.message ? e.message : e)); b.disabled = false; b.textContent = "비밀번호 새로 만들기"; });
        return;
      }
      if(a === "account-del" && opts.adminLogin){
        var ad2 = find("admins"); if(!ad2) return;
        if(!confirm((ad2.d.name || id) + " 님의 운영진 권한을 삭제할까요?")) return;
        if(ad2.d.loginKey) act(col("login_keys").doc(ad2.d.loginKey).delete());
        act(col("admins").doc(id).delete());
        return;
      }
      if(a === "account-add"){
        var em = root.querySelector("#adm-a-email").value.trim().toLowerCase();
        var role = root.querySelector("#adm-a-role").value;
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("이메일을 정확히 입력해주세요."); return; }
        act(col("admins").doc(em).set({ email: em, name: root.querySelector("#adm-a-name").value.trim(), role: role,
          college: role === "운영" ? root.querySelector("#adm-a-college").value : "", createdAt: Date.now() }));
        root.querySelector("#adm-a-email").value = ""; root.querySelector("#adm-a-name").value = ""; b.blur();
        return;
      }
      if(a === "account-del"){ if(confirm(id + " 의 운영진 권한을 삭제할까요?")) act(col("admins").doc(id).delete()); return; }
      if(a === "csv-vote"){
        downloadCsv("성과보고회_출석투표.csv", [["팀","이름","응답","시각"]].concat(scoped("attendance_votes").map(function(x){
          return [x.d.team, x.d.name, x.d.choice === "attend" ? "참석" : "불참", x.d.createdAt ? new Date(x.d.createdAt).toLocaleString("ko-KR") : ""];
        }))); return;
      }
      if(a === "csv-suggest"){
        downloadCsv("건의함.csv", [["단과대","작성자","내용","상태","답변","작성시각"]].concat(scoped("suggestion_posts").sort(byNewest).map(function(x){
          return [x.d.college || "", x.d.author, x.d.text, x.d.status || "접수", x.d.reply || "", x.d.createdAt ? new Date(x.d.createdAt).toLocaleString("ko-KR") : ""];
        }))); return;
      }
      if(a === "csv-teams"){
        var tm = mainEl._teams || {}, tn = mainEl._teamNames || [];
        downloadCsv("팀별_활동현황.csv", [["팀","명단 인원","팀 게시글","미션 인증","승인","출석 투표"]].concat(tn.map(function(t){
          var r = tm[t]; return [t, r.roster, r.posts, r.verify, r.approved, r.votes];
        }))); return;
      }
    });

    /* 대량 등록 중 화면이 수천 번 다시 그려지지 않도록 묶어서 그려요 */
    var renderTimer = null;
    function scheduleRender(){
      if(renderTimer) return;
      renderTimer = setTimeout(function(){ renderTimer = null; render(); }, 300);
    }

    /* ---------- 실시간 구독 ---------- */
    COLLS.concat(isSuper ? ["admins"] : []).forEach(function(name){
      try{
        var u = col(name).onSnapshot(function(snap){
          S[name] = snap.docs.map(function(d){ return { id: String(d.id), d: d.data() || {} }; });
          scheduleRender();
        }, function(err){ errors[name] = err; });
        unsubs.push(u);
      }catch(e){ errors[name] = e; }
    });
    render();
    return { destroy: function(){ unsubs.forEach(function(u){ try{ if(typeof u === "function") u(); }catch(e){} }); if(root.parentNode) root.parentNode.removeChild(root); } };
  }

  window.DSFMAdmin = { mount: mount };
})();
</script>
<script>
(function(){
  "use strict";

  /* firebaseConfig — 학생용 사이트(index.html)와 똑같은 값을 붙여넣으세요. */
  var firebaseConfig = {
    apiKey: "AIzaSyDiPlp8TEQhaFJISh6DgRY4UlOx-_cDFBw",
    authDomain: "dsfm-455c1.firebaseapp.com",
    projectId: "dsfm-455c1",
    storageBucket: "dsfm-455c1.firebasestorage.app",
    messagingSenderId: "431929065623",
    appId: "1:431929065623:web:bbd20ab2a8319fe2b569d2"
  };

  /* 사이트 관리자(개발 담당) UID — 운영진 계정 목록과 상관없이 항상 총괄 권한.
     firestore.rules 의 OWNER UID 목록과 똑같이 맞춰주세요. */
  var OWNER_UIDS = ["0Amr9PWdKTNxUCeFuwVOFGD3AWo2"];
  var COLLEGES = ["글로벌융합대학","아트앤디자인대학","과학기술대학","자유전공학부"];

  /* 학생 화면에 처음 들어있는 기본 공지 — "기본 공지 불러오기" 버튼이 이걸 Firestore로 옮겨요 */
  var DEFAULT_NOTICES = [
    {tag:"전체 이벤트", label:"PICNIC DAY", detail:"10월 18일(일) 오후 1시, 영근터에서 진행돼요. 팀별 참가 신청은 10월 12일까지 QUEST BOARD에서 받아요."},
    {tag:"공통 마감", label:"QUEST 미션 마감", detail:"10월 31일(토)까지 EAT·CAMPUS·LOCAL·TOGETHER 중 2개 이상 완료해주세요. RANDOM은 이번 달 깜짝 공개돼요."},
    {tag:"공통 마감", label:"활동보고서 제출", detail:"11월 20일(금)까지 개인별 활동보고서를 제출해주세요. 작성 가이드는 공지사항에 곧 올라올 예정이에요."}
  ];

  var errEl = document.getElementById("login-error");
  function showErr(msg){ errEl.textContent = msg; errEl.style.display = "block"; }
  var ready = false;
  if(typeof firebase === "undefined"){
    showErr("Firebase를 불러오지 못했어요. 인터넷 연결을 확인해주세요.");
  } else if(false){
    showErr("firebaseConfig가 아직 설정되지 않았어요. 이 파일 아래쪽의 firebaseConfig에 Firebase 설정값을 붙여넣어 주세요.");
  } else {
    firebase.initializeApp(firebaseConfig);
    ready = true;
  }

  var ERR_KO = {
    "auth/invalid-email": "이메일 형식이 올바르지 않아요.",
    "auth/invalid-credential": "이메일 또는 비밀번호가 맞지 않아요.",
    "auth/wrong-password": "이메일 또는 비밀번호가 맞지 않아요.",
    "auth/user-not-found": "등록되지 않은 운영진 계정이에요.",
    "auth/too-many-requests": "로그인 시도가 너무 많아요. 잠시 후 다시 시도해주세요.",
    "auth/unauthorized-domain": "이 주소가 Firebase에 승인되지 않았어요. Authentication > 설정 > 승인된 도메인에 지금 주소를 추가해주세요."
  };
  /* 운영진 로그인: 이름 + 휴대폰 뒷자리 → login_keys/{sha256("dsfm-admin|이름|뒷자리")} 에서
     로그인용 내부 계정(이메일 형식)을 찾아 비밀번호로 Firebase 로그인 */
  var ADMIN_DOMAIN = "admin.dsfm-455c1.firebaseapp.com";
  function adminKey(name, pin){
    var text = "dsfm-admin|" + String(name).replace(/\s+/g, "") + "|" + String(pin).replace(/\D/g, "");
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0" + b.toString(16)).slice(-2); }).join("");
    });
  }
  var emailMode = false;
  document.getElementById("mode-toggle").addEventListener("click", function(e){
    e.preventDefault(); emailMode = !emailMode; errEl.style.display = "none";
    document.getElementById("pin-fields").style.display = emailMode ? "none" : "";
    document.getElementById("email-fields").style.display = emailMode ? "" : "none";
    document.getElementById("login-sub").textContent = emailMode ? "사이트 관리자 이메일로 로그인해요." : "이름, 휴대폰 뒷자리 4자리, 비밀번호를 입력해주세요.";
    this.textContent = emailMode ? "운영진 로그인 (이름·뒷자리)" : "사이트 관리자 이메일 로그인";
  });
  function fail(err){ showErr(ERR_KO[err.code] || ("로그인에 실패했어요: " + (err.message || err.code))); }
  function login(){
    if(!ready) return;
    errEl.style.display = "none";
    var pw = document.getElementById("admin-password").value;
    if(emailMode){
      var email = document.getElementById("admin-email").value.trim();
      if(!email || !pw){ showErr("이메일과 비밀번호를 입력해주세요."); return; }
      firebase.auth().signInWithEmailAndPassword(email, pw).catch(fail);
      return;
    }
    var name = document.getElementById("admin-name").value.replace(/\s+/g, "");
    var pin = document.getElementById("admin-pin").value.replace(/\D/g, "");
    if(!name){ showErr("이름을 입력해주세요."); return; }
    if(pin.length !== 4){ showErr("휴대폰 뒷자리 4자리를 입력해주세요."); return; }
    if(!pw){ showErr("비밀번호를 입력해주세요."); return; }
    adminKey(name, pin).then(function(key){
      return firebase.firestore().collection("login_keys").doc(key).get();
    }).then(function(snap){
      var d = snap.exists ? snap.data() : null;
      if(!d || !d.adminEmail){ showErr("등록된 운영진이 아니에요. 이름과 휴대폰 뒷자리를 확인해주세요."); return; }
      return firebase.auth().signInWithEmailAndPassword(d.adminEmail, pw).catch(function(err){
        if(err.code === "auth/invalid-credential" || err.code === "auth/wrong-password") showErr("비밀번호가 맞지 않아요.");
        else fail(err);
      });
    }).catch(fail);
  }
  document.getElementById("login-submit").addEventListener("click", login);
  ["admin-name","admin-pin","admin-email","admin-password"].forEach(function(id){
    document.getElementById(id).addEventListener("keydown", function(e){ if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); login(); } });
  });

  var handle = null;
  if(ready){
    firebase.auth().onAuthStateChanged(function(user){
      var root = document.getElementById("admin-root");
      if(user){
        if(handle) return;
        document.getElementById("login-screen").style.display = "none";
        root.style.display = "block";
        var fdb = firebase.firestore();
        var isPinUser = String(user.email || "").slice(-ADMIN_DOMAIN.length - 1) === "@" + ADMIN_DOMAIN;
        var adminLogin = {
          canChangeOwn: isPinUser,
          changeOwn: function(pw){ return firebase.auth().currentUser.updatePassword(pw); },
          /* 새 운영진 로그인 계정 만들기 — 보조 앱으로 만들어서 지금 로그인한 총괄 관리자는 그대로 유지 */
          _make: function(key, pw){
            var em = "a" + key.slice(0, 20) + "-" + Date.now().toString(36) + "@" + ADMIN_DOMAIN;
            var app2 = firebase.apps.filter(function(a){ return a.name === "creator"; })[0] || firebase.initializeApp(firebaseConfig, "creator");
            return app2.auth().createUserWithEmailAndPassword(em, pw).then(function(){ return app2.auth().signOut(); }).then(function(){ return em; });
          },
          create: function(p){
            var self = this, key;
            return adminKey(p.name, p.pin).then(function(k){ key = k; return fdb.collection("login_keys").doc(key).get(); })
              .then(function(snap){
                if(snap.exists) throw new Error("같은 이름과 휴대폰 뒷자리의 운영진이 이미 있어요.");
                return self._make(key, p.password);
              }).then(function(em){
                return fdb.collection("admins").doc(em).set({ email: em, name: p.name, role: p.role, college: p.college, loginKey: key, pinHint: "**" + p.pin.slice(-2), createdAt: Date.now() })
                  .then(function(){ return fdb.collection("login_keys").doc(key).set({ adminEmail: em, name: p.name, college: "", kind: "admin", createdAt: Date.now() }); });
              });
          },
          /* 비밀번호 재설정 — 새 로그인 계정을 만들어 바꿔 끼우고, 예전 계정은 권한을 지워요 */
          reset: function(ad, pw){
            var d = ad.d, oldId = ad.id;
            return this._make(d.loginKey, pw).then(function(em){
              var nd = {}; Object.keys(d).forEach(function(k){ nd[k] = d[k]; }); nd.email = em; nd.updatedAt = Date.now();
              return fdb.collection("admins").doc(em).set(nd)
                .then(function(){ return fdb.collection("login_keys").doc(d.loginKey).set({ adminEmail: em, name: d.name || "", college: "", kind: "admin", createdAt: Date.now() }); })
                .then(function(){ return fdb.collection("admins").doc(oldId).delete(); });
            });
          }
        };
        function mountWith(role, college, label, displayName){
          handle = window.DSFMAdmin.mount(root, fdb, {
            role: role, college: college, colleges: COLLEGES, adminLogin: adminLogin,
            whoami: (displayName || user.email) + " · " + label,
            exitLabel: "로그아웃",
            defaultNotices: DEFAULT_NOTICES,
            onExit: function(){ firebase.auth().signOut(); }
          });
        }
        if(OWNER_UIDS.indexOf(user.uid) >= 0){ mountWith("총괄", "", "사이트 관리자"); return; }
        var email = String(user.email || "").toLowerCase();
        fdb.collection("admins").doc(email).get().then(function(snap){
          var a = snap.exists ? snap.data() : null;
          if(!a || (a.role !== "총괄" && a.role !== "운영") || (a.role === "운영" && COLLEGES.indexOf(a.college) < 0)){
            root.style.display = "none"; document.getElementById("login-screen").style.display = "flex";
            firebase.auth().signOut();
            showErr("운영진 권한이 없는 계정이에요. 총괄 관리자에게 문의해주세요.");
            return;
          }
          mountWith(a.role, a.role === "운영" ? a.college : "", a.role === "총괄" ? "총괄 관리자" : "운영 관리자 · " + a.college, a.name);
        }).catch(function(err){
          firebase.auth().signOut();
          showErr("권한을 확인하지 못했어요: " + (err.message || err.code));
        });
      } else {
        if(handle){ handle.destroy(); handle = null; }
        root.style.display = "none";
        document.getElementById("login-screen").style.display = "flex";
      }
    });
  }
})();
</script>
